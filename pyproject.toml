[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dressgl"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
coppelia = ["coppeliasim-zmqremoteapi-client>=2.0.4"]
render = ["numpy>=1.26"]
gui = ["numpy>=1.26", "PySide6>=6.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["coppelia: exige o CoppeliaSim aberto"]