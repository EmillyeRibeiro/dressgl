[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dressgl"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "numpy>=1.26"]
coppelia = ["coppeliasim-zmqremoteapi-client>=2.0.4"]
render = ["numpy>=1.26"]
# D61: janela em tkinter (biblioteca padrão); PySide6 removido.
gui = ["numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "coppelia: exige o CoppeliaSim aberto",
    "lento: regressão completa do metricas_coppelia.csv (~1 min)",
]
addopts = ["--strict-markers", "-m", "not lento"]